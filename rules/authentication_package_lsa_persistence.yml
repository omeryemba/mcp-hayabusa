title: LSA Authentication Package Persistence
id: 9ad44d33-4f99-4c45-be87-cbaa02324243
status: experimental
description: |
  Detects a new value being set on the LSA 'Authentication Packages' registry
  value (HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication Packages).
  DLLs listed here are loaded into lsass.exe by the Local Security Authority
  at every boot, giving an attacker persistent, SYSTEM-level code execution
  that starts before most EDR/AV agents finish initializing, and that can
  observe credential material during logon (T1547.002).

  This is the same LSA-registry-persistence pattern as the Security Support
  Provider technique (T1547.005) — same registry key, a neighboring value —
  for which hayabusa's builtin rule set already has a dedicated,
  high-severity detection
  (sigma\builtin\registry\registry_event\registry_event_ssp_added_lsa_config.yml).
  The Authentication Packages value had no equivalent dedicated rule in
  either this project's custom `rules/` or hayabusa's builtin set prior
  to this one.

  Severity: high, because a successful write to this value grants an
  attacker persistent SYSTEM-context code execution with credential
  visibility on every boot, which is a serious and hard-to-remove foothold;
  not "critical" because legitimate security/identity software (smart card
  middleware, SSO/federation clients, some VPN/DLP suites) also registers
  custom authentication packages here, so a human should confirm the DLL
  named in the new value is not an expected, signed, vendor-installed
  component before escalating.

  Correction (2026-07-29): the initial version of this rule had no
  `Channel` selector anywhere in its detection logic. Verified directly
  against hayabusa (`-v` output showed `Evtx files loaded after channel
  filter: 0`) that this causes hayabusa's channel filter to exclude every
  input file and disable the rule entirely — a guaranteed zero-detection
  rule regardless of real activity. Every other working rule in this
  project's set explicitly declares a `Channel` gate; this one didn't.
  Added the `registry_event` selection block below (Sysmon's
  `TargetObject`/`EventType` fields, confirmed as the correct field names
  via a real sample, are only reachable once the channel is declared) and
  re-verified firing 1/1 against a real Sysmon EventID 13 SetValue sample.
references:
  - https://attack.mitre.org/techniques/T1547/002/
  - https://learn.microsoft.com/en-us/windows/win32/secauthn/authentication-packages
  - https://learn.microsoft.com/en-us/windows/win32/secauthn/writing-an-authentication-package
author: mcp-hayabusa
date: 2026-07-25
tags:
  - attack.persistence
  - attack.credential-access
  - attack.t1547.002
logsource:
  category: registry_event
  product: windows
detection:
  registry_event:
    Channel: Microsoft-Windows-Sysmon/Operational
  selection_target:
    TargetObject|endswith: '\Control\Lsa\Authentication Packages'
  selection_type:
    EventType: SetValue
  condition: registry_event and selection_target and selection_type
falsepositives:
  - Installation or reconfiguration of legitimate third-party authentication
    software that registers its own authentication package (e.g. smart-card
    middleware, SSO/federation clients, some VPN or DLP endpoint suites) —
    verify the DLL named in the new value is signed and matches a known
    vendor install before escalating.
  - Windows feature updates / in-place OS upgrades that rewrite LSA
    configuration as part of reapplying default security settings.
  - Group Policy or configuration-management tooling (SCCM, Intune, custom
    LSA-hardening scripts) that intentionally manages this value as part of
    an approved security baseline.
  - This rule fires on any SetValue event against this registry value
    regardless of which DLL is named, since Sysmon's registry_event category
    does not reliably expose the new value's contents for every provider/
    event combination — triage should confirm the actual DLL added, not
    just that the value changed.
level: high
