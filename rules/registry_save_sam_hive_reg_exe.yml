title: Registry Save or Export of SAM, SECURITY, or SYSTEM Hive via reg.exe
id: c808b8f1-36b6-455f-a197-9649f4bff882
status: experimental
description: |
  Detects reg.exe being used to save or export the SAM, SECURITY, or
  SYSTEM registry hives (e.g. `reg.exe save HKLM\SAM sam.hive`). This is
  the classic local precursor to offline credential extraction: SAM
  holds local account password hashes, SYSTEM holds the boot key needed
  to decrypt them, and SECURITY holds cached domain credentials and LSA
  secrets — copying any of them out lets an attacker parse hashes with
  tools like secretsdump.py or Mimikatz without further access to the
  host (T1003.002).

  This rule replaces the two equivalent hayabusa built-in rules for this
  exact behavior (proc_creation_win_reg_dump_sam.yml,
  proc_creation_win_credential_acquisition_registry_hive_dumping.yml),
  which are both `status: deprecated` and therefore excluded from a scan
  by default (hayabusa requires `--enable-deprecated-rules` to include
  them) — leaving no active detection for this behavior out of the box.

  Scope: this only covers the local reg.exe process-creation vector. A
  Backup Operator (or other SeBackupPrivilege holder) dumping these same
  hives remotely via the winreg RPC interface never spawns reg.exe on
  the target at all — that fileless vector is covered instead by
  sensitive_privilege_use_backup_restore.yml and
  remote_registry_service_started.yml in this rule set.

  Severity: high, because a successful hive export stages the exact
  material needed for offline password-hash extraction with no further
  interaction required — an all-but-confirmed credential-dumping event;
  not critical because legitimate registry backups (imaging/maintenance
  scripts, documented troubleshooting procedures) use this identical
  command shape.
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.002/T1003.002.md
author: mcp-hayabusa
date: 2026-07-28
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
    - Image|endswith: \reg.exe
    - OriginalFileName: reg.exe
  selection_verb:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    CommandLine|contains:
      - hklm\sam
      - hklm\security
      - hklm\system
  condition: all of selection_*
falsepositives:
  - Scheduled maintenance, imaging, or backup scripts that export these
    hives as part of an approved system-state backup procedure.
  - Help desk or IT staff following an official troubleshooting
    procedure that calls for a registry hive export.
level: high
