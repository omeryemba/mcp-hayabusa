name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

  validate-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate detection rules
        run: |
          set -e
          for rule in rules/*.yml; do
            python .claude/skills/detection-engineering/scripts/validate-rule.py "$rule"
          done

  validate-rule-execution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mcp-hayabusa
        run: pip install -e .

      - name: Install hayabusa binary
        env:
          # Pinned to the exact version tests/fixtures/evtx/ was curated and
          # verified against (see tests/fixtures/evtx/PROVENANCE.md). Bump
          # deliberately, alongside re-verifying the fixtures, not casually --
          # a hayabusa upgrade can change matching behavior (see the "Hayabusa
          # version drift" risk noted for this runner).
          HAYABUSA_VERSION: "3.10.0"
        run: |
          set -e
          curl -sSL -o hayabusa.zip \
            "https://github.com/Yamato-Security/hayabusa/releases/download/v${HAYABUSA_VERSION}/hayabusa-${HAYABUSA_VERSION}-lin-x64-gnu.zip"
          # hayabusa resolves config/default_profile.yaml, config/profiles.yaml,
          # and rules/config/* (windash_characters.txt, level_tuning.txt, etc.)
          # relative to its own executable's directory at startup, regardless of
          # the -r rules path passed on the command line -- so both trees must
          # be extracted alongside the binary, not just the binary itself.
          unzip -q hayabusa.zip \
            "hayabusa-${HAYABUSA_VERSION}-lin-x64-gnu" \
            "config/*" \
            "rules/config/*"
          chmod +x "hayabusa-${HAYABUSA_VERSION}-lin-x64-gnu"
          echo "HAYABUSA_BIN=$PWD/hayabusa-${HAYABUSA_VERSION}-lin-x64-gnu" >> "$GITHUB_ENV"

      - name: Confirm fixtures are present
        run: |
          set -e
          shopt -s nullglob
          fixtures=(tests/fixtures/evtx/*.evtx)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "::error::No .evtx fixtures found under tests/fixtures/evtx/ -- execution tests would silently skip everything instead of actually verifying rules."
            exit 1
          fi
          echo "Found ${#fixtures[@]} fixture(s):"
          printf '  %s\n' "${fixtures[@]##*/}"

      - name: Run execution-based rule tests
        run: python .claude/skills/detection-engineering/scripts/validate-rule-execution.py rules/
